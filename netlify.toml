[build]
  # Copy agents config to public/ so the frontend can fetch it as a static file
  command   = "mkdir -p public && cp config/agents.json public/agents.json"
  publish   = "public"
  functions = "netlify/functions"

[functions."run_task"]
  timeout = 26

[functions."run_manager"]
  timeout = 26

[functions."agent_report"]
  timeout = 26

[functions."weekly_report"]
  timeout = 26

# API routes → serverless functions
[[redirects]]
  from   = "/api/run"
  to     = "/.netlify/functions/run_task"
  status = 200

[[redirects]]
  from   = "/api/manager"
  to     = "/.netlify/functions/run_manager"
  status = 200

[[redirects]]
  from   = "/api/report"
  to     = "/.netlify/functions/agent_report"
  status = 200

[[redirects]]
  from   = "/api/weekly"
  to     = "/.netlify/functions/weekly_report"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
